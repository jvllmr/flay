ci:
  skip:
    - ty
    - cargo-fix

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.5
    hooks:
      - id: uv-lock
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/hadialqattan/pycln
    rev: "v2.6.0"
    hooks:
      - id: pycln
        args:
          - --all
          - --disable-all-dunder-policy
  - repo: https://github.com/AndrejOrsula/pre-commit-cargo
    rev: 0.5.0
    hooks:
      - id: cargo-fmt
      - id: cargo-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.2"
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: 1fb54d06ff80b555a6a428d9b12ff0796e67d923 # v0.74.0
    hooks:
      - id: oxfmt
        types_or: [toml, json, yaml, markdown, mdx]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
  - repo: local
    hooks:
      - id: ty
        name: static type check
        language: system
        entry: .venv/bin/ty check
        pass_filenames: false
