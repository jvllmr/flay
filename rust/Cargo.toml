[package]
name = "flay_rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "flay"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
ruff_python_ast = "0.0.21"
ruff_python_codegen = "0.0.21"
ruff_python_parser = "0.0.21"
ruff_text_size = "0.0.21"
ruff_python_stdlib = "0.0.21"
thin-vec = "0.2.21"
